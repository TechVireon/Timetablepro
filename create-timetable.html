<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Create Timetable | TimetablePro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">Timetable<span class="brand-pro">Pro</span></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="create-timetable.html" class="active">Create Timetable</a>
        <a href="my-timetables.html">My Timetables</a>
        <a href="settings.html">Settings</a>
        <a href="#" id="logoutBtn">Logout</a>
      </nav>
    </aside>

    <main class="dashboard-main">
      <button class="sidebar-toggle-btn" id="sidebarToggle">☰ Menu</button>
      <h1>Create Timetable</h1>

      <div class="card-panel">
        <label>
          <span>Days per week</span>
          <input type="number" id="days" value="5" min="1" max="6" />
        </label>
        <label>
          <span>Periods per day</span>
          <input type="number" id="periodsPerDay" value="7" min="1" max="10" />
        </label>
      </div>

      <div id="classesContainer"></div>

      <button class="button button-secondary" id="addClassBtn">+ Add Class</button>
      <button class="button button-primary" id="generateBtn">Generate Timetable</button>

      <div id="resultArea"></div>
    </main>
  </div>

  <footer class="site-footer minimal-footer">
    <p class="footer-copyright">© 2026 Tech Vireon</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://qhpvcxrktcfbafykzfzr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFocHZjeHJrdGNmYmFmeWt6ZnpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NjMyMjIsImV4cCI6MjEwMTIzOTIyMn0.uC7PZ1OVwxb5_xFk7PhTHyXcOr1tn9tceJqUvWW-mdg";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const BACKEND_URL = "https://timetablepro-backend-jxw6.onrender.com";

    const dayNames = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];

    function timingFromSettings(s) {
      return {
        startTime: s.start_time || "08:00",
        periodLength: s.period_length || 40,
        periodLengthAfter: s.period_length_after || s.period_length || 40,
        breakEnabled: s.break_enabled !== false,
        breakAfter: s.break_after || 4,
        breakLength: s.break_length || 30
      };
    }

    function timingToSnake(t) {
      return {
        start_time: t.startTime,
        period_length: t.periodLength,
        period_length_after: t.periodLengthAfter,
        break_enabled: t.breakEnabled,
        break_after: t.breakAfter,
        break_length: t.breakLength
      };
    }

    window.savedLayoutPreference = "horizontal";
    window.savedTiming = timingFromSettings({});
    window.campusMode = false;
    window.campuses = [];

    async function checkLogin() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
        return;
      }

      const meta = session.user.user_metadata || {};
      window.savedLayoutPreference = meta.timetable_layout || "horizontal";
      window.savedTiming = timingFromSettings(meta);
      window.campusMode = meta.campuses_enabled === true && Array.isArray(meta.campuses) && meta.campuses.length > 0;
      window.campuses = window.campusMode ? meta.campuses : [];
    }

    const loginReady = checkLogin().then(function () {
      document.querySelectorAll("#classesContainer > .class-box").forEach(updateCampusField);
    });

    document.getElementById("logoutBtn").addEventListener("click", async function (e) {
      e.preventDefault();
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
    });

    document.getElementById("sidebarToggle").addEventListener("click", function () {
      document.getElementById("sidebar").classList.toggle("open");
    });

    function updateCampusField(div) {
      const field = div.querySelector(".campus-field");
      const select = div.querySelector(".campusSelect");
      if (!field || !select) return;

      if (!window.campusMode) {
        field.style.display = "none";
        return;
      }

      const current = select.value;
      select.innerHTML = "";
      window.campuses.forEach(function (c) {
        const option = document.createElement("option");
        option.value = c.name;
        option.textContent = c.name;
        select.appendChild(option);
      });
      if (current) select.value = current;
      field.style.display = "";
    }

    let classCount = 0;

    function addClass() {
      classCount++;
      const div = document.createElement("div");
      div.className = "card-panel class-box";
      div.id = `class-${classCount}`;
      div.innerHTML = `
        <button type="button" class="removeClassBtn" aria-label="Remove class">×</button>
        <label>
          <span>Class name</span>
          <input type="text" class="className" placeholder="e.g. 9th A" />
        </label>
        <label class="campus-field" style="display:none">
          <span>Campus</span>
          <select class="campusSelect"></select>
        </label>
        <p class="subjects-label">Subjects</p>
        <div class="subjectsContainer"></div>
        <button type="button" class="button button-secondary addSubjectBtn">+ Add Subject</button>
      `;
      document.getElementById("classesContainer").appendChild(div);
      updateCampusField(div);

      div.querySelector(".removeClassBtn").addEventListener("click", function () {
        if (confirm("Remove this class and all its subjects?")) div.remove();
      });

      div.querySelector(".addSubjectBtn").addEventListener("click", function () {
        addSubject(div.querySelector(".subjectsContainer"));
      });

      addSubject(div.querySelector(".subjectsContainer"));
    }

    function addSubject(container) {
      const row = document.createElement("div");
      row.className = "subject-row";
      row.innerHTML = `
        <input type="text" class="subjectName" placeholder="Subject (e.g. Math)" />
        <input type="text" class="teacherName" placeholder="Teacher name" />
        <input type="number" class="periodsWeek" placeholder="Periods per week" min="1" value="5" />
        <button type="button" class="removeSubjectBtn" aria-label="Remove subject">×</button>
      `;
      container.appendChild(row);

      row.querySelector(".removeSubjectBtn").addEventListener("click", function () {
        row.remove();
      });
    }

    document.getElementById("addClassBtn").addEventListener("click", addClass);
    addClass();

    function collectClasses() {
      const classes = {};
      document.querySelectorAll("#classesContainer > .card-panel").forEach(function (classDiv) {
        const classNameValue = classDiv.querySelector(".className").value.trim();
        if (!classNameValue) return;

        const subjects = [];
        classDiv.querySelectorAll(".subject-row").forEach(function (row) {
          const subject = row.querySelector(".subjectName").value.trim();
          const teacher = row.querySelector(".teacherName").value.trim();
          const periods = parseInt(row.querySelector(".periodsWeek").value);
          if (subject && teacher && periods) {
            subjects.push({ subject, teacher, periods_per_week: periods });
          }
        });
        if (subjects.length) classes[classNameValue] = subjects;
      });
      return classes;
    }

    function collectCampusMap() {
      const map = {};
      document.querySelectorAll("#classesContainer > .card-panel").forEach(function (classDiv) {
        const classNameValue = classDiv.querySelector(".className").value.trim();
        if (!classNameValue) return;
        const select = classDiv.querySelector(".campusSelect");
        map[classNameValue] = (window.campusMode && select && select.value) ? select.value : null;
      });
      return map;
    }

    function findDuplicateClassName() {
      const seen = {};
      const inputs = document.querySelectorAll("#classesContainer .className");
      for (let i = 0; i < inputs.length; i++) {
        const n = inputs[i].value.trim().toLowerCase();
        if (!n) continue;
        if (seen[n]) return inputs[i].value.trim();
        seen[n] = true;
      }
      return null;
    }

    function getTimingFor(name, campusMap) {
      const campusName = campusMap ? campusMap[name] : null;
      if (window.campusMode && campusName) {
        const campus = window.campuses.find(function (c) { return c.name === campusName; });
        if (campus) return timingFromSettings(campus);
      }
      return window.savedTiming;
    }

    document.getElementById("generateBtn").addEventListener("click", async function () {
      await loginReady;

      const days = parseInt(document.getElementById("days").value);
      const periodsPerDay = parseInt(document.getElementById("periodsPerDay").value);
      const classes = collectClasses();
      const resultArea = document.getElementById("resultArea");

      if (Object.keys(classes).length === 0) {
        resultArea.innerHTML = `<p style="color:red">Please add at least one class with a subject, a teacher and the periods per week.</p>`;
        return;
      }

      const duplicate = findDuplicateClassName();
      if (duplicate) {
        resultArea.innerHTML = `<p style="color:red">Two classes have the same name: ${duplicate}. Please give each class a different name, for example "9th A Main" and "9th A City".</p>`;
        return;
      }

      const campusMap = collectCampusMap();
      const classTiming = {};
      if (window.campusMode) {
        Object.keys(classes).forEach(function (name) {
          classTiming[name] = timingToSnake(getTimingFor(name, campusMap));
        });
      }

      resultArea.innerHTML = "<p>Generating timetable...</p>";

      try {
        const response = await fetch(`${BACKEND_URL}/generate-timetable`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ days, periods_per_day: periodsPerDay, classes, class_timing: classTiming })
        });

        const data = await response.json();

        if (!response.ok) {
          resultArea.innerHTML = `<p style="color:red">${data.detail || "Something went wrong."}</p>`;
          return;
        }

        renderTimetables(data.timetable, days, periodsPerDay, campusMap);
        await saveTimetables(data.timetable, days, periodsPerDay, campusMap);
      } catch (err) {
        console.error("Generate failed:", err);
        resultArea.innerHTML = `<p style="color:red">Could not reach the server. It may be waking up, so please wait a minute and try again.</p>`;
      }
    });

    async function saveTimetables(timetableData, days, periodsPerDay, campusMap) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;

      for (const name in timetableData) {
        const campusName = window.campusMode ? campusMap[name] : null;
        const row = {
          user_id: session.user.id,
          class_name: name,
          data: timetableData[name],
          days: days,
          periods_per_day: periodsPerDay
        };
        if (campusName) {
          row.campus_name = campusName;
          row.timing = timingToSnake(getTimingFor(name, campusMap));
        }

        const { error } = await supabaseClient.from("timetables").insert(row);
        if (error) console.log("SAVE ERROR:", error.message);
      }
    }

    function minutesToTime(totalMinutes) {
      const h = Math.floor(totalMinutes / 60) % 24;
      const m = totalMinutes % 60;
      const ampm = h >= 12 ? "PM" : "AM";
      let displayHour = h % 12;
      if (displayHour === 0) displayHour = 12;
      return `${displayHour}:${m.toString().padStart(2, "0")} ${ampm}`;
    }

    function getPeriodTimeline(timing, totalPeriods) {
      const [h, m] = timing.startTime.split(":").map(Number);
      let current = h * 60 + m;
      const breakOn = timing.breakEnabled !== false;
      const lengthAfter = timing.periodLengthAfter || timing.periodLength;
      const timeline = [];

      for (let p = 1; p <= totalPeriods; p++) {
        const length = (breakOn && p > timing.breakAfter) ? lengthAfter : timing.periodLength;
        const startMin = current;
        const endMin = current + length;
        timeline.push({ period: p, isBreak: false, label: minutesToTime(startMin) + " - " + minutesToTime(endMin) });
        current = endMin;

        if (breakOn && p === timing.breakAfter) {
          const breakEnd = current + timing.breakLength;
          timeline.push({ period: null, isBreak: true, label: minutesToTime(current) + " - " + minutesToTime(breakEnd) });
          current = breakEnd;
        }
      }
      return timeline;
    }

    async function downloadPdf(name, schedule, days, periodsPerDay, timing, campusName) {
      try {
        const response = await fetch(`${BACKEND_URL}/download-saved-pdf/${encodeURIComponent(name)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            schedule: schedule,
            days: days,
            periods_per_day: periodsPerDay,
            layout: window.savedLayoutPreference || "horizontal",
            start_time: timing.startTime,
            period_length: timing.periodLength,
            period_length_after: timing.periodLengthAfter,
            break_enabled: timing.breakEnabled,
            break_after: timing.breakAfter,
            break_length: timing.breakLength,
            campus_name: campusName || null
          })
        });

        if (!response.ok) {
          alert("Could not create the PDF. Please try again in a minute.");
          return;
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${name}_timetable.pdf`;
        a.click();
      } catch (err) {
        console.error("PDF download failed:", err);
        alert("Could not reach the server. Please try again in a minute.");
      }
    }

    function renderTimetables(timetable, days, periodsPerDay, campusMap) {
      const layout = window.savedLayoutPreference || "horizontal";
      const resultArea = document.getElementById("resultArea");
      resultArea.innerHTML = "";

      const names = Object.keys(timetable);
      if (window.campusMode) {
        const order = window.campuses.map(function (c) { return c.name; });
        names.sort(function (a, b) {
          return order.indexOf(campusMap[a]) - order.indexOf(campusMap[b]);
        });
      }

      let lastCampus = null;

      names.forEach(function (name) {
        const campusName = window.campusMode ? campusMap[name] : null;
        if (campusName && campusName !== lastCampus) {
          const heading = document.createElement("h2");
          heading.className = "campus-title";
          heading.textContent = campusName;
          resultArea.appendChild(heading);
          lastCampus = campusName;
        }

        const timing = getTimingFor(name, campusMap);
        const timeline = getPeriodTimeline(timing, periodsPerDay);

        const section = document.createElement("div");
        section.className = "card-panel";
        let html = `<h3>${name}</h3><table class="timetable-table">`;

        if (layout === "horizontal") {
          html += `<tr><th>Time</th>`;
          for (let d = 0; d < days; d++) html += `<th>${dayNames[d]}</th>`;
          html += `</tr>`;

          timeline.forEach(function (slot) {
            if (slot.isBreak) {
              html += `<tr><td class="break-cell">Break<br><small>${slot.label}</small></td>`;
              for (let d = 0; d < days; d++) html += `<td class="break-cell">-</td>`;
              html += `</tr>`;
            } else {
              html += `<tr><td>${slot.label}</td>`;
              for (let d = 0; d < days; d++) {
                const cell = timetable[name][d] && timetable[name][d][slot.period - 1];
                html += `<td>${cell ? cell.subject + "<br><small>" + cell.teacher + "</small>" : "-"}</td>`;
              }
              html += `</tr>`;
            }
          });
        } else {
          html += `<tr><th>Day</th>`;
          timeline.forEach(function (slot) {
            html += slot.isBreak
              ? `<th class="break-cell">Break<br><small>${slot.label}</small></th>`
              : `<th>${slot.label}</th>`;
          });
          html += `</tr>`;

          for (let d = 0; d < days; d++) {
            html += `<tr><td>${dayNames[d]}</td>`;
            timeline.forEach(function (slot) {
              if (slot.isBreak) {
                html += `<td class="break-cell">-</td>`;
              } else {
                const cell = timetable[name][d] && timetable[name][d][slot.period - 1];
                html += `<td>${cell ? cell.subject + "<br><small>" + cell.teacher + "</small>" : "-"}</td>`;
              }
            });
            html += `</tr>`;
          }
        }

        html += `</table>`;
        section.innerHTML = html;

        const downloadBtn = document.createElement("button");
        downloadBtn.className = "button button-primary";
        downloadBtn.textContent = "Download PDF";
        downloadBtn.addEventListener("click", function () {
          downloadPdf(name, timetable[name], days, periodsPerDay, timing, campusName);
        });
        section.appendChild(downloadBtn);

        resultArea.appendChild(section);
      });
    }
  </script>
</body>
</html>
