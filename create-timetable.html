<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Timetable | TimetablePro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">TimetablePro</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="my-timetables.html">My Timetables</a>
        <a href="settings.html">Settings</a>
        <a href="#" id="logoutBtn">Logout</a>
      </nav>
    </aside>

    <main class="dashboard-main">
      <button class="sidebar-toggle-btn" id="sidebarToggle">☰ Menu</button>
      <h1>Create Timetable</h1>

      <div class="card-panel">
        <label>
          <span>Days per week</span>
          <input type="number" id="days" value="5" min="1" max="6" />
        </label>
        <label>
          <span>Periods per day</span>
          <input type="number" id="periodsPerDay" value="7" min="1" max="10" />
        </label>
      </div>

      <div id="classesContainer"></div>

      <button class="button button-secondary" id="addClassBtn">+ Add Class</button>
      <button class="button button-primary" id="generateBtn">Generate Timetable</button>

      <div id="resultArea"></div>
    </main>
  </div>

  <footer class="site-footer minimal-footer">
    <p class="footer-copyright">© 2026 Tech Vireon</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://qhpvcxrktcfbafykzfzr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFocHZjeHJrdGNmYmFmeWt6ZnpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NjMyMjIsImV4cCI6MjEwMTIzOTIyMn0.uC7PZ1OVwxb5_xFk7PhTHyXcOr1tn9tceJqUvWW-mdg";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const dayNames = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];

    const BACKEND_URL = "https://timetablepro-backend-jxw6.onrender.com";

    async function checkLogin() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    window.location.href = "login.html";
    return;
  }

  window.savedLayoutPreference = session.user.user_metadata?.timetable_layout || "horizontal";
  window.savedTiming = {
    startTime: session.user.user_metadata?.start_time || "08:00",
    periodLength: session.user.user_metadata?.period_length || 40,
    breakAfter: session.user.user_metadata?.break_after || 4,
    breakLength: session.user.user_metadata?.break_length || 30
  };
}
checkLogin();

    document.getElementById("logoutBtn").addEventListener("click", async function (e) {
      e.preventDefault();
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
    });

    let classCount = 0;

    function addClass() {
      classCount++;
      const classId = `class-${classCount}`;
      const div = document.createElement("div");
      div.className = "card-panel";
      div.id = classId;
      div.innerHTML = `
        <button type="button" class="removeClassBtn" aria-label="Remove class">×</button>
        <div class="classHeader">
          <label>
            <span>Class name</span>
            <input type="text" class="className" placeholder="e.g. 9th A" aria-label="Class name" />
          </label>
        </div>
        <div class="subjectsHeading">Subjects</div>
        <div class="subjectsContainer"></div>
        <button type="button" class="button button-secondary addSubjectBtn">+ Add Subject</button>
      `;
      document.getElementById("classesContainer").appendChild(div);

      div.querySelector(".removeClassBtn").addEventListener("click", function () {
        if (confirm("Remove this class and all its subjects?")) {
          div.remove();
        }
      });

      div.querySelector(".addSubjectBtn").addEventListener("click", function () {
        addSubject(div.querySelector(".subjectsContainer"));
      });

      addSubject(div.querySelector(".subjectsContainer"));
    }

    function addSubject(container) {
      const row = document.createElement("div");
      row.className = "subject-row";
      row.innerHTML = `
        <input type="text" class="subjectName" placeholder="Subject" aria-label="Subject" />
        <input type="text" class="teacherName" placeholder="Teacher" aria-label="Teacher" />
        <label class="periodsField">
          <span>Periods per week</span>
          <input type="number" class="periodsWeek" placeholder="Periods per week" aria-label="Periods per week" min="1" value="5" />
        </label>
        <button type="button" class="removeSubjectBtn" aria-label="Remove subject">×</button>
      `;
      container.appendChild(row);

      row.querySelector(".removeSubjectBtn").addEventListener("click", function () {
        row.remove();
      });
    }

    document.getElementById("addClassBtn").addEventListener("click", addClass);
    addClass();

    document.getElementById("generateBtn").addEventListener("click", async function () {
      const days = parseInt(document.getElementById("days").value);
      const periodsPerDay = parseInt(document.getElementById("periodsPerDay").value);

      const classes = {};
      document.querySelectorAll("#classesContainer > .card-panel").forEach(function (classDiv) {
        const className = classDiv.querySelector(".className").value.trim();
        if (!className) return;

        const subjects = [];
        classDiv.querySelectorAll(".subject-row").forEach(function (row) {
          const subject = row.querySelector(".subjectName").value.trim();
          const teacher = row.querySelector(".teacherName").value.trim();
          const periods = parseInt(row.querySelector(".periodsWeek").value);
          if (subject && teacher && periods) {
            subjects.push({ subject, teacher, periods_per_week: periods });
          }
        });
        if (subjects.length) classes[className] = subjects;
      });

      const resultArea = document.getElementById("resultArea");
      resultArea.innerHTML = "<p>Generating timetable...</p>";

      try {
        const response = await fetch(`${BACKEND_URL}/generate-timetable`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ days, periods_per_day: periodsPerDay, classes })
        });

        const data = await response.json();

        if (!response.ok) {
          resultArea.innerHTML = `<p style="color:red">${data.detail || "Something went wrong."}</p>`;
          return;
        }

                renderTimetables(data.timetable, days, periodsPerDay);
        await saveTimetables(data.timetable, days, periodsPerDay);
      } catch (err) {
        resultArea.innerHTML = `<p style="color:red">Could not reach the server. Check your backend link.</p>`;
      }
    });

        async function saveTimetables(timetableData, days, periodsPerDay) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        console.log("No session found — user not logged in?");
        return;
      }

      for (const className in timetableData) {
        const { error } = await supabaseClient.from("timetables").insert({
          user_id: session.user.id,
          class_name: className,
          data: timetableData[className]
        });

        if (error) {
          console.log("SAVE ERROR:", error.message);
        } else {
          console.log("Saved successfully:", className);
        }
      }
    }
        function minutesToTime(totalMinutes) {
      const h = Math.floor(totalMinutes / 60) % 24;
      const m = totalMinutes % 60;
      const ampm = h >= 12 ? "PM" : "AM";
      let displayHour = h % 12;
      if (displayHour === 0) displayHour = 12;
      return `${displayHour}:${m.toString().padStart(2, "0")} ${ampm}`;
    }

    function getPeriodTimeline(timing, totalPeriods) {
      const [h, m] = timing.startTime.split(":").map(Number);
      let current = h * 60 + m;
      const timeline = [];
      for (let p = 1; p <= totalPeriods; p++) {
        const startMin = current;
        const endMin = current + timing.periodLength;
        timeline.push({ period: p, isBreak: false, label: minutesToTime(startMin) + " - " + minutesToTime(endMin) });
        current = endMin;
        if (p === timing.breakAfter) {
          const breakEnd = current + timing.breakLength;
          timeline.push({ period: null, isBreak: true, label: minutesToTime(current) + " - " + minutesToTime(breakEnd) });
          current = breakEnd;
        }
      }
      return timeline;
    }
        function renderTimetables(timetable, days, periodsPerDay) {
      const layout = window.savedLayoutPreference || "horizontal";
      const timing = window.savedTiming || { startTime: "08:00", periodLength: 40, breakAfter: 4, breakLength: 30 };
      const timeline = getPeriodTimeline(timing, periodsPerDay);
      const resultArea = document.getElementById("resultArea");
      resultArea.innerHTML = "";

      Object.keys(timetable).forEach(function (className) {
        const section = document.createElement("div");
        section.className = "card-panel";
        let html = `<h3>${className}</h3><table class="timetable-table">`;

        if (layout === "horizontal") {
          html += `<tr><th>Time</th>`;
          for (let d = 0; d < days; d++) html += `<th>${dayNames[d]}</th>`;
          html += `</tr>`;

          timeline.forEach(function (slot) {
            if (slot.isBreak) {
              html += `<tr><td class="break-cell">Break<br><small>${slot.label}</small></td>`;
              for (let d = 0; d < days; d++) html += `<td class="break-cell">-</td>`;
              html += `</tr>`;
            } else {
              html += `<tr><td>${slot.label}</td>`;
              for (let d = 0; d < days; d++) {
                const cell = timetable[className][d] && timetable[className][d][slot.period - 1];
                html += `<td>${cell ? cell.subject + "<br><small>" + cell.teacher + "</small>" : "-"}</td>`;
              }
              html += `</tr>`;
            }
          });
        } else {
          html += `<tr><th>Day</th>`;
          timeline.forEach(function (slot) {
            html += slot.isBreak ? `<th class="break-cell">Break<br><small>${slot.label}</small></th>` : `<th>${slot.label}</th>`;
          });
          html += `</tr>`;

          for (let d = 0; d < days; d++) {
            html += `<tr><td>${dayNames[d]}</td>`;
            timeline.forEach(function (slot) {
              if (slot.isBreak) {
                html += `<td class="break-cell">-</td>`;
              } else {
                const cell = timetable[className][d] && timetable[className][d][slot.period - 1];
                html += `<td>${cell ? cell.subject + "<br><small>" + cell.teacher + "</small>" : "-"}</td>`;
              }
            });
            html += `</tr>`;
          }
        }

        html += `</table>`;
        html += `<button class="button button-primary downloadBtn" data-class="${className}">Download PDF</button>`;
        section.innerHTML = html;
        resultArea.appendChild(section);
      });

      document.querySelectorAll(".downloadBtn").forEach(function (btn) {
        btn.addEventListener("click", async function () {
          const className = btn.getAttribute("data-class");
          const classes = {};
          document.querySelectorAll("#classesContainer > .card-panel").forEach(function (classDiv) {
            const cName = classDiv.querySelector(".className").value.trim();
            const subjects = [];
            classDiv.querySelectorAll(".subject-row").forEach(function (row) {
              subjects.push({
                subject: row.querySelector(".subjectName").value.trim(),
                teacher: row.querySelector(".teacherName").value.trim(),
                periods_per_week: parseInt(row.querySelector(".periodsWeek").value)
              });
            });
            classes[cName] = subjects;
          });

          const response = await fetch(`${BACKEND_URL}/download-pdf/${className}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ days, periods_per_day: periodsPerDay, classes })
          });

          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${className}_timetable.pdf`;
          a.click();
        });
      });
    }
  </script>
</body>
</html>
